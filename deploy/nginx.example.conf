# Example nginx reverse-proxy config for rust-file-manager.
# Replace example.com with your domain and adjust paths.

server {
    listen 80;
    server_name example.com;

    # Match MAX_FILE_SIZE_MB from the app config
    client_max_body_size 200M;

    # Telegram Mini App: upload chunks are small (UPLOAD_CHUNK_SIZE_MB + margin),
    # stream them straight to the app instead of buffering on disk.
    # Include the collection URL without a slash: nginx must not redirect GET/POST.
    location /api/v1/uploads {
        client_max_body_size 10M;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Signed download links carry a token in the path: keep it out of logs.
    location /d/ {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
