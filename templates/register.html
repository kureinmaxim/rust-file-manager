<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — Файловый менеджер</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6f8;
            color: #1f2933;
        }
        .login-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 32px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 16px rgba(0,0,0,.06);
        }
        h1 { font-size: 20px; margin: 0 0 8px; text-align: center; }
        .hint { font-size: 13px; color: #6b7280; text-align: center; margin: 0 0 16px; }
        label { display: block; font-size: 13px; color: #6b7280; margin: 14px 0 4px; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus { outline: 2px solid #2563eb33; border-color: #2563eb; }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 11px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        button:disabled { opacity: .6; }
        .error {
            display: none;
            margin-top: 14px;
            padding: 10px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 14px;
            text-align: center;
        }

        * { box-sizing: border-box; }
        body { padding: 24px 16px; min-height: 100vh; min-height: 100svh; background: #f5f7fa; }
        .login-card, .card { width: 100%; max-width: 400px; border-color: #dce4eb; box-shadow: 0 12px 40px #172b3a08; }
        input { font-size: 16px; min-height: 46px; color: #172b3a; }
        input:focus { outline: 3px solid #087f7526; border-color: #087f75; }
        button { background: #087f75; min-height: 46px; font-size: 16px; }
        :focus-visible { outline: 3px solid #54b9ae; outline-offset: 3px; }
        .password-field { position: relative; }
        .password-field input { padding-right: 72px; }
        button.password-toggle { position: absolute; right: 5px; top: 3px; width: auto; margin: 0; padding: 5px 8px; min-height: 40px; font-size: 12px; color: #087f75; background: transparent; }
        .intro { text-align: center; color: #617384; font-size: 13px; margin: -8px 0 22px; }
        .login-card h1 { color: #172b3a; }
        .hint, label { color: #617384; }
        @media (max-width: 420px) { .login-card, .card { padding: 26px 22px; } }
    </style>
</head>
<body>
<form class="login-card" id="registerForm">
    <h1>Создание аккаунта</h1>
    <p class="hint">Вас пригласили в файловый менеджер. Придумайте имя и пароль — у вас будет личная папка и доступ к общим файлам.</p>
    <label for="username">Имя пользователя</label>
    <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false"
           pattern="[A-Za-z0-9_\-]{3,32}" title="3–32 символа: латинские буквы, цифры, «_» и «-»" required>
    <label for="password">Пароль (минимум 8 символов)</label>
    <div class="password-field"><input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" id="passwordToggle" aria-controls="password" aria-pressed="false">Показать</button></div>
    <button type="submit" id="submitBtn">Создать аккаунт</button>
    <div class="error" id="error" role="alert"></div>
</form>

<script>
document.getElementById('passwordToggle').addEventListener('click', () => {
    const input = document.getElementById('password');
    const button = document.getElementById('passwordToggle');
    const visible = input.type === 'password';
    input.type = visible ? 'text' : 'password';
    button.textContent = visible ? 'Скрыть' : 'Показать';
    button.setAttribute('aria-pressed', String(visible));
});
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const button = document.getElementById('submitBtn');
    const errorBox = document.getElementById('error');
    button.disabled = true;
    errorBox.style.display = 'none';

    const params = new URLSearchParams(new FormData(e.target));
    params.set('token', new URLSearchParams(location.search).get('token') || '');

    try {
        const response = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params,
        });
        const data = await response.json();
        if (data.success) {
            location.href = '/';
        } else {
            errorBox.textContent = data.message;
            errorBox.style.display = 'block';
        }
    } catch {
        errorBox.textContent = 'Ошибка соединения с сервером';
        errorBox.style.display = 'block';
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
