<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Приглашение недействительно — Файловый менеджер</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6f8;
            color: #1f2933;
        }
        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 32px;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,.06);
        }
        h1 { font-size: 20px; margin: 0 0 12px; }
        p { font-size: 14px; color: #6b7280; }

        * { box-sizing: border-box; }
        body { padding: 24px 16px; min-height: 100vh; min-height: 100svh; background: #f5f7fa; }
        .login-card, .card { width: 100%; max-width: 400px; border-color: #dce4eb; box-shadow: 0 12px 40px #172b3a08; }
        input { font-size: 16px; min-height: 46px; color: #172b3a; }
        input:focus { outline: 3px solid #087f7526; border-color: #087f75; }
        button { background: #087f75; min-height: 46px; font-size: 16px; }
        :focus-visible { outline: 3px solid #54b9ae; outline-offset: 3px; }
        .password-field { position: relative; }
        .password-field input { padding-right: 72px; }
        button.password-toggle { position: absolute; right: 5px; top: 3px; width: auto; margin: 0; padding: 5px 8px; min-height: 40px; font-size: 12px; color: #087f75; background: transparent; }
        .intro { text-align: center; color: #617384; font-size: 13px; margin: -8px 0 22px; }
        .login-card h1 { color: #172b3a; }
        .hint, label { color: #617384; }
        @media (max-width: 420px) { .login-card, .card { padding: 26px 22px; } }
    </style>
</head>
<body>
<div class="card">
    <h1>⏳ Ссылка недействительна</h1>
    <p>Эта ссылка-приглашение уже использована или истекла. Попросите администратора создать новую.</p>
    <p><a href="/login" style="color:#087f75">Перейти ко входу</a></p>
</div>
</body>
</html>
